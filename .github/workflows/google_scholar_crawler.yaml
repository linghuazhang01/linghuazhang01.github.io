name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Google Scholar ID
        id: scholar_id
        run: |
          if [ -z "${GOOGLE_SCHOLAR_ID:-}" ]; then
            echo "::warning::GOOGLE_SCHOLAR_ID is not configured; skipping citation update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Install Reqs
        if: steps.scholar_id.outputs.enabled == 'true'
        run: |
          sudo apt-get install python3-setuptools
      - name: Run
        if: steps.scholar_id.outputs.enabled == 'true'
        run: |
          cd ./google_scholar_crawler
          python3 -m pip install -r requirements.txt
          timeout 120s python3 main.py || {
            echo "::warning::Citation crawler failed; keeping the previous citation data."
            exit 0
          }
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git diff --cached --quiet && { echo "No citation changes to publish."; exit 0; }
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
